<!doctype html>
<!-- The page holds no text of its own (ADR-0041): data-text, data-label,
     data-title and data-placeholder name keys in ui/src/strings/en.ts, which
     applyStrings() fills at start. scripts/check-strings.mjs checks both. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Schnipsle</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <button id="back" class="icon" type="button" data-label="app.back" hidden>‹</button>
      <div class="vault">
        <strong id="vault-name">Schnipsle</strong>
        <span id="vault-hint" class="muted"></span>
      </div>
      <button id="new-note" type="button" data-text="app.newNote" disabled></button>
      <button
        id="pick-vault"
        type="button"
        data-text="app.openVault"
        data-title="app.openVaultTitle"
      ></button>
      <button
        id="show-settings"
        class="icon"
        type="button"
        data-label="app.settings"
        data-title="app.settings"
        hidden
      >
        &#x2699;&#xFE0E;
      </button>
    </header>

    <div id="setup" class="banner" role="alertdialog" aria-labelledby="setup-text" hidden>
      <span id="setup-text"></span>
      <button id="setup-create" type="button" data-text="setup.create"></button>
      <button id="setup-cancel" type="button" data-text="common.cancel"></button>
      <details id="setup-details">
        <summary data-text="setup.details"></summary>
        <ul id="setup-items"></ul>
      </details>
    </div>

    <div id="read-only" class="banner" role="status" hidden>
      <span id="read-only-text"></span>
    </div>

    <div id="strays" class="banner" role="status" hidden>
      <span id="strays-text"></span>
      <button id="strays-move" type="button" data-text="strays.move"></button>
      <button id="strays-later" type="button" data-text="common.notNow"></button>
      <details>
        <summary data-text="strays.show"></summary>
        <ul id="strays-items"></ul>
      </details>
    </div>

    <div id="conflict" class="banner" role="alert" hidden>
      <span data-text="conflict.text"></span>
      <button id="use-theirs" type="button" data-text="conflict.useOther"></button>
      <button id="keep-mine" type="button" data-text="conflict.keepMine"></button>
    </div>

    <div id="sync-conflict" class="banner" role="alert" hidden>
      <span id="sync-conflict-text"></span>
      <button id="sync-keep-mine" type="button" data-text="syncConflict.keepThis"></button>
      <button id="sync-use-other" type="button" data-text="conflict.useOther"></button>
      <button id="sync-keep-both" type="button" data-text="syncConflict.keepBoth" hidden></button>
      <details>
        <summary data-text="syncConflict.show"></summary>
        <textarea id="sync-other" readonly rows="8"></textarea>
      </details>
    </div>

    <main class="layout" data-view="list">
      <nav class="list" data-label="list.label">
        <div class="search-row">
          <input
            id="search"
            type="search"
            data-placeholder="list.search"
            data-label="list.searchLabel"
            autocomplete="off"
            spellcheck="false"
            disabled
          />
          <button
            id="save-search"
            type="button"
            class="small"
            data-text="common.save"
            data-title="list.saveSearchTitle"
            hidden
          ></button>
        </div>
        <details id="smart-panel" class="tags-panel" open>
          <summary data-text="smart.title"></summary>
          <ul id="smart-tree" class="tag-tree" role="tree" data-label="smart.title"></ul>
          <button
            id="new-smart-folder"
            type="button"
            class="small add-folder"
            data-text="smart.new"
            hidden
          ></button>
        </details>
        <details id="tags-panel" class="tags-panel" open>
          <summary data-text="tags.title"></summary>
          <ul id="tag-tree" class="tag-tree" role="tree" data-label="tags.title"></ul>
        </details>
        <div class="list-tools">
          <select id="sort" data-label="list.sortLabel">
            <option value="modified" data-text="list.sortModified"></option>
            <option value="title" data-text="list.sortTitle"></option>
          </select>
          <button
            id="show-tags"
            type="button"
            class="small phone-only"
            data-text="tags.title"
          ></button>
          <button
            id="show-trash"
            type="button"
            class="small"
            aria-pressed="false"
            data-text="list.trash"
          ></button>
          <button
            id="export-list"
            type="button"
            class="small"
            data-text="common.export"
            hidden
          ></button>
        </div>
        <p id="list-filter" class="list-filter" hidden>
          <span id="list-filter-text"></span>
          <button id="clear-filter" type="button" class="small" data-text="list.showAll"></button>
        </p>
        <p id="empty" class="muted" data-text="list.noVault"></p>
        <ul id="notes"></ul>
      </nav>
      <section class="editor" data-label="editor.label">
        <div id="editor-host" class="editor-host"></div>
        <div id="history" class="history" hidden>
          <div class="history-bar">
            <strong data-text="history.title"></strong>
            <span id="history-hint" class="muted"></span>
            <button
              id="history-compare"
              type="button"
              class="small"
              aria-pressed="false"
              data-text="history.compare"
              disabled
            ></button>
            <select
              id="history-with"
              class="small"
              data-label="history.compareWith"
              hidden
            ></select>
            <button
              id="history-restore"
              type="button"
              class="small"
              data-text="history.restore"
              disabled
            ></button>
            <button
              id="history-copy"
              type="button"
              class="small"
              data-text="history.asNewNote"
              disabled
            ></button>
            <button
              id="history-close"
              type="button"
              class="small"
              data-text="common.close"
            ></button>
          </div>
          <div class="history-body">
            <ul id="history-list" data-label="history.versions"></ul>
            <div id="history-preview" class="editor-host history-preview"></div>
            <div id="history-diff" class="history-diff" hidden></div>
          </div>
        </div>
        <footer class="status">
          <span id="status" aria-live="polite"></span>
          <span id="tags" class="tags"></span>
          <button
            id="undo-delete"
            type="button"
            class="small"
            data-text="common.undo"
            hidden
          ></button>
          <button
            id="pin"
            type="button"
            class="small"
            aria-pressed="false"
            data-text="note.pin"
            disabled
          ></button>
          <button
            id="show-history"
            type="button"
            class="small"
            data-text="history.title"
            disabled
          ></button>
          <button
            id="export-note"
            type="button"
            class="small"
            data-text="common.export"
            hidden
            disabled
          ></button>
          <button
            id="add-image"
            type="button"
            class="small"
            data-text="note.image"
            disabled
          ></button>
          <input id="image-file" type="file" accept="image/*" multiple hidden />
          <button
            id="add-music"
            type="button"
            class="small"
            data-text="note.music"
            disabled
          ></button>
          <button
            id="delete-note"
            type="button"
            class="small"
            data-text="common.delete"
            disabled
          ></button>
          <button
            id="mode"
            type="button"
            class="small"
            aria-pressed="false"
            data-text="note.source"
          ></button>
        </footer>
      </section>
    </main>

    <dialog id="quit-dialog" aria-labelledby="quit-title" aria-describedby="quit-text">
      <form method="dialog" class="folder-form">
        <h2 id="quit-title" data-text="quit.title"></h2>
        <p id="quit-text"></p>
        <div class="folder-buttons">
          <span class="spacer"></span>
          <button id="quit-anyway" type="button" class="danger" data-text="quit.anyway"></button>
          <button id="quit-cancel" type="submit" data-text="common.cancel" autofocus></button>
        </div>
      </form>
    </dialog>

    <dialog id="folder-dialog" aria-labelledby="folder-dialog-title">
      <form id="folder-form" class="folder-form" novalidate>
        <h2 id="folder-dialog-title" data-text="folder.title"></h2>
        <label>
          <span data-text="folder.name"></span>
          <input id="folder-name" type="text" autocomplete="off" />
        </label>
        <label>
          <span data-text="folder.search"></span>
          <input
            id="folder-query"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            data-placeholder="folder.searchExample"
          />
        </label>
        <label>
          <span data-text="folder.inside"></span>
          <select id="folder-parent"></select>
        </label>
        <label>
          <span data-text="folder.order"></span>
          <select id="folder-sort"></select>
        </label>
        <p id="folder-error" class="folder-error" role="alert" hidden></p>
        <div id="folder-confirm" class="folder-confirm" role="alertdialog" hidden>
          <span id="folder-confirm-text"></span>
          <button
            id="folder-delete-yes"
            type="button"
            class="danger"
            data-text="common.delete"
          ></button>
          <button id="folder-delete-no" type="button" data-text="common.keep"></button>
        </div>
        <div class="folder-buttons">
          <button
            id="folder-delete"
            type="button"
            class="danger"
            data-text="folder.delete"
          ></button>
          <span class="spacer"></span>
          <button id="folder-cancel" type="button" data-text="common.cancel"></button>
          <button id="folder-save" type="submit" data-text="common.save"></button>
        </div>
      </form>
    </dialog>

    <dialog id="retag-dialog" aria-labelledby="retag-title">
      <form id="retag-form" class="folder-form retag-form" novalidate>
        <h2 id="retag-title"></h2>
        <label>
          <span data-text="retag.newName"></span>
          <input
            id="retag-name"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </label>
        <p id="retag-help" class="muted retag-help" data-text="retag.help"></p>
        <section id="retag-report" class="retag-report" aria-live="polite" hidden>
          <p id="retag-summary"></p>
          <ul id="retag-notes" class="retag-notes"></ul>
        </section>
        <p id="retag-error" class="folder-error" role="alert" hidden></p>
        <div class="folder-buttons">
          <button id="retag-undo" type="button" data-text="common.undo" hidden></button>
          <span class="spacer"></span>
          <button id="retag-cancel" type="button" data-text="common.cancel"></button>
          <button id="retag-start" type="submit" data-text="retag.start" disabled></button>
        </div>
      </form>
    </dialog>

    <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title">
      <div class="import">
        <h2 id="import-title" data-text="import.title"></h2>
        <section id="import-choose" class="import-choose">
          <label>
            <span data-text="import.from"></span>
            <select id="import-source">
              <option value="apple-notes" data-text="import.source.appleNotes"></option>
              <option value="simplenote" data-text="import.source.simplenote"></option>
              <option value="html" data-text="import.source.html"></option>
              <option value="markdown" data-text="import.source.markdown"></option>
            </select>
          </label>
          <label class="import-tags">
            <span data-text="import.tagsLabel"></span>
            <input
              id="import-tags"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              data-placeholder="import.tagsExample"
              aria-describedby="import-tags-help"
            />
          </label>
          <p id="import-tags-help" class="muted import-tags-help" data-text="import.tagsHelp"></p>
          <div id="import-help-apple-notes" class="import-help">
            <p data-text="import.help.appleNotes"></p>
            <ol>
              <li data-text="import.help.appleNotesExport"></li>
              <li data-text="import.help.appleNotesChoose"></li>
            </ol>
          </div>
          <div id="import-help-simplenote" class="import-help">
            <p data-text="import.help.simplenote"></p>
            <p data-text="import.help.simplenoteTags"></p>
          </div>
          <div id="import-help-html" class="import-help">
            <p data-text="import.help.html"></p>
            <p data-text="import.help.htmlPictures"></p>
          </div>
          <div id="import-help-markdown" class="import-help">
            <p data-text="import.help.markdown"></p>
            <p data-text="import.help.markdownPictures"></p>
          </div>
          <div class="import-pick">
            <button id="import-pick" type="button" data-text="import.chooseFolder"></button>
            <button
              id="import-pick-file"
              type="button"
              data-text="import.chooseFile"
              hidden
            ></button>
            <span id="import-path" class="muted"></span>
          </div>
        </section>
        <div id="import-metadata" class="import-box" hidden>
          <span id="import-metadata-text"></span>
          <button
            id="import-read-metadata"
            type="button"
            class="small"
            data-text="import.readMetadata"
          ></button>
        </div>
        <section id="import-report" class="import-report" aria-live="polite" hidden>
          <p id="import-summary" class="import-summary"></p>
          <ul id="import-notices" class="import-notices"></ul>
          <table class="import-items">
            <thead>
              <tr>
                <th scope="col" data-text="import.column.note"></th>
                <th scope="col" data-text="import.column.import"></th>
                <th scope="col" data-text="import.column.where"></th>
              </tr>
            </thead>
            <tbody id="import-items"></tbody>
          </table>
        </section>
        <div id="import-progress" class="import-progress" hidden>
          <progress id="import-bar" max="1" value="0"></progress>
          <span id="import-progress-text" class="muted"></span>
        </div>
        <p id="import-error" class="folder-error" role="alert" hidden></p>
        <div class="folder-buttons">
          <span class="spacer"></span>
          <button id="import-cancel" type="button" data-text="common.cancel"></button>
          <button id="import-start" type="button" data-text="import.start" disabled></button>
        </div>
      </div>
    </dialog>
    <dialog id="export-dialog" class="import-dialog export-dialog" aria-labelledby="export-title">
      <div class="import">
        <h2 id="export-title" data-text="export.title"></h2>
        <section id="export-choose" class="import-choose export-choose">
          <fieldset>
            <legend data-text="export.notes"></legend>
            <label>
              <input id="export-what-note" type="radio" name="export-what" value="note" />
              <span id="export-note-label"></span>
            </label>
            <label>
              <input id="export-what-list" type="radio" name="export-what" value="list" />
              <span id="export-list-label"></span>
            </label>
          </fieldset>
          <label>
            <span data-text="export.formatLabel"></span>
            <select id="export-format"></select>
          </label>
          <p id="export-no-pandoc" class="muted" data-text="export.noPandoc" hidden></p>
          <fieldset id="export-files">
            <legend data-text="export.files"></legend>
            <label>
              <input id="export-layout-one" type="radio" name="export-layout" value="singleFile" />
              <span id="export-one-label"></span>
            </label>
            <label>
              <input
                id="export-layout-many"
                type="radio"
                name="export-layout"
                value="filePerNote"
              />
              <span id="export-many-label"></span>
            </label>
            <label>
              <input id="export-layout-zip" type="radio" name="export-layout" value="zip" />
              <span id="export-zip-label"></span>
            </label>
          </fieldset>
          <label id="export-paper-row">
            <span data-text="export.paper"></span>
            <select id="export-paper">
              <option value="a4" data-text="export.paperA4"></option>
              <option value="letter" data-text="export.paperLetter"></option>
            </select>
          </label>
          <label id="export-contents-row">
            <input id="export-contents" type="checkbox" />
            <span data-text="export.contents"></span>
          </label>
          <label id="export-page-numbers-row">
            <input id="export-page-numbers" type="checkbox" />
            <span data-text="export.pageNumbers"></span>
          </label>
          <label>
            <input id="export-keep-tags" type="checkbox" />
            <span data-text="export.keepTags"></span>
          </label>
          <label>
            <input id="export-abc-source" type="checkbox" />
            <span data-text="export.abcSource"></span>
          </label>
          <p id="export-unsaved" class="import-box warn" hidden></p>
        </section>
        <div id="export-progress" class="import-progress" hidden>
          <progress></progress>
          <span id="export-progress-text" class="muted"></span>
        </div>
        <section id="export-report" class="import-report" aria-live="polite" hidden>
          <p id="export-summary" class="import-summary"></p>
          <p id="export-numbered" class="import-summary" hidden></p>
          <ul id="export-warnings" class="import-notices" hidden></ul>
          <table id="export-problems-table" class="import-items">
            <thead>
              <tr>
                <th data-text="import.column.note"></th>
                <th data-text="export.differentColumn"></th>
              </tr>
            </thead>
            <tbody id="export-problems"></tbody>
          </table>
        </section>
        <p id="export-error" class="folder-error" role="alert" hidden></p>
        <div class="folder-buttons">
          <span class="spacer"></span>
          <button id="export-share" type="button" data-text="export.share" hidden></button>
          <button id="export-reveal" type="button" hidden></button>
          <button id="export-cancel" type="button" data-text="common.cancel"></button>
          <button id="export-start" type="button" data-text="export.start"></button>
        </div>
      </div>
    </dialog>
    <dialog id="imports-dialog" class="import-dialog" aria-labelledby="imports-title">
      <div class="import">
        <h2 id="imports-title" data-text="imports.title"></h2>
        <section id="imports-list" class="import-report">
          <p id="imports-summary" class="import-summary"></p>
          <table class="import-items">
            <thead>
              <tr>
                <th scope="col" data-text="imports.column.when"></th>
                <th scope="col" data-text="import.from"></th>
                <th scope="col" data-text="imports.column.notes"></th>
                <th scope="col" data-label="common.undo"></th>
              </tr>
            </thead>
            <tbody id="imports-runs"></tbody>
          </table>
        </section>
        <section id="imports-undo" class="import-report" aria-live="polite" hidden>
          <p id="imports-undo-summary" class="import-summary"></p>
          <table class="import-items">
            <thead>
              <tr>
                <th scope="col" data-text="import.column.note"></th>
                <th scope="col" data-text="common.undo"></th>
                <th scope="col" data-text="import.column.where"></th>
              </tr>
            </thead>
            <tbody id="imports-items"></tbody>
          </table>
        </section>
        <p id="imports-error" class="folder-error" role="alert" hidden></p>
        <div class="folder-buttons">
          <button id="imports-back" type="button" data-text="imports.all" hidden></button>
          <span class="spacer"></span>
          <button id="imports-close" type="button" data-text="common.close"></button>
          <button id="imports-start" type="button" data-text="imports.undo" hidden></button>
        </div>
      </div>
    </dialog>
    <dialog
      id="settings-dialog"
      class="import-dialog settings-dialog"
      aria-labelledby="settings-title"
    >
      <div class="import">
        <h2 id="settings-title" data-text="app.settings"></h2>
        <section class="settings-section" aria-labelledby="settings-vault-title">
          <h3 id="settings-vault-title" data-text="settings.vault"></h3>
          <p id="settings-vault-hint" class="muted"></p>
          <div id="settings-vault-fields" class="settings-fields">
            <fieldset>
              <legend data-text="settings.retention"></legend>
              <label>
                <span data-text="settings.keepAllBefore"></span>
                <input id="settings-keep-all" type="text" inputmode="numeric" size="4" />
                <span data-text="settings.keepAllAfter"></span>
              </label>
              <label>
                <span data-text="settings.keepDailyBefore"></span>
                <input id="settings-keep-daily" type="text" inputmode="numeric" size="4" />
                <span data-text="settings.keepDailyAfter"></span>
              </label>
              <p id="settings-retention-note" class="muted"></p>
            </fieldset>
            <div id="settings-confirm" class="folder-confirm" role="alertdialog" hidden>
              <span id="settings-confirm-text"></span>
              <button
                id="settings-confirm-yes"
                type="button"
                class="danger"
                data-text="settings.removeThem"
              ></button>
              <button id="settings-confirm-no" type="button" data-text="settings.keepThem"></button>
            </div>
            <label>
              <span data-text="settings.chords"></span>
              <select id="settings-chords">
                <option value="english" data-text="settings.chordsEnglish"></option>
                <option value="german" data-text="settings.chordsGerman"></option>
              </select>
            </label>
            <p id="settings-chords-note" class="muted" hidden></p>
          </div>
          <p id="settings-vault-error" class="folder-error" role="alert" hidden></p>
        </section>
        <section
          id="settings-device"
          class="settings-section"
          aria-labelledby="settings-device-title"
          hidden
        >
          <h3 id="settings-device-title" data-text="settings.device"></h3>
          <p class="muted" data-text="settings.deviceHint"></p>
          <div class="settings-fields">
            <fieldset>
              <legend data-text="settings.pandoc"></legend>
              <p id="settings-pandoc-status"></p>
              <div class="folder-buttons">
                <button
                  id="settings-pandoc-pick"
                  type="button"
                  data-text="settings.pandocPick"
                ></button>
                <button
                  id="settings-pandoc-find"
                  type="button"
                  data-text="settings.pandocFind"
                  hidden
                ></button>
              </div>
            </fieldset>
            <label>
              <input id="settings-updates" type="checkbox" />
              <span data-text="settings.updates"></span>
            </label>
            <p class="muted" data-text="settings.updatesHint"></p>
          </div>
          <p id="settings-device-error" class="folder-error" role="alert" hidden></p>
        </section>
        <section class="settings-section" aria-labelledby="settings-diagnostics-title">
          <h3 id="settings-diagnostics-title" data-text="diagnostics.title"></h3>
          <p class="muted" data-text="diagnostics.hint"></p>
          <p id="diagnostics-app"></p>
          <p id="diagnostics-memory"></p>
          <ul id="diagnostics-list" class="diagnostics-list"></ul>
          <p id="diagnostics-nothing" class="muted" data-text="diagnostics.nothing" hidden></p>
          <div class="folder-buttons">
            <button id="diagnostics-refresh" type="button" data-text="diagnostics.refresh"></button>
            <button id="diagnostics-copy" type="button" data-text="diagnostics.copy"></button>
            <span id="diagnostics-status" class="muted" role="status"></span>
          </div>
          <textarea
            id="diagnostics-text"
            class="diagnostics-text"
            readonly
            rows="8"
            data-label="diagnostics.title"
            hidden
          ></textarea>
        </section>
