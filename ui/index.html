<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Schnipsle</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <button id="back" class="icon" type="button" aria-label="Back to notes" hidden>‹</button>
      <div class="vault">
        <strong id="vault-name">Schnipsle</strong>
        <span id="vault-hint" class="muted">Spike: vault folder access</span>
      </div>
      <button id="new-note" type="button" disabled>New</button>
      <button id="pick-vault" type="button">Open folder</button>
    </header>

    <div id="conflict" class="banner" role="alert" hidden>
      <span>This note was changed on another device while you were editing.</span>
      <button id="use-theirs" type="button">Use other version</button>
      <button id="keep-mine" type="button">Keep mine</button>
    </div>

    <div id="sync-conflict" class="banner" role="alert" hidden>
      <span id="sync-conflict-text"></span>
      <button id="sync-keep-mine" type="button">Keep this version</button>
      <button id="sync-use-other" type="button">Use other version</button>
      <details>
        <summary>Show the other version</summary>
        <textarea id="sync-other" readonly rows="8"></textarea>
      </details>
    </div>

    <main class="layout" data-view="list">
      <nav class="list" aria-label="Notes">
        <p id="empty" class="muted">
          Open a folder to start. On iPhone, pick a folder in iCloud Drive.
        </p>
        <ul id="notes"></ul>
      </nav>
      <section class="editor" aria-label="Editor">
        <textarea id="text" spellcheck="true" disabled placeholder="Select a note"></textarea>
        <footer class="status">
          <span id="status" aria-live="polite"></span>
          <span id="tags" class="tags"></span>
        </footer>
      </section>
    </main>
  </body>
</html>
