<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Schnipsle</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <button id="back" class="icon" type="button" aria-label="Back to notes" hidden>‹</button>
      <div class="vault">
        <strong id="vault-name">Schnipsle</strong>
        <span id="vault-hint" class="muted">Spike: vault folder access</span>
      </div>
      <button id="new-note" type="button" disabled>New</button>
      <button id="pick-vault" type="button">Open folder</button>
    </header>

    <div id="setup" class="banner" role="alertdialog" aria-labelledby="setup-text" hidden>
      <span id="setup-text"></span>
      <button id="setup-create" type="button">Make it a vault</button>
      <button id="setup-cancel" type="button">Cancel</button>
      <details id="setup-details">
        <summary>What will be moved</summary>
        <ul id="setup-items"></ul>
      </details>
    </div>

    <div id="read-only" class="banner" role="status" hidden>
      <span id="read-only-text"></span>
    </div>

    <div id="conflict" class="banner" role="alert" hidden>
      <span>This note was changed on another device while you were editing.</span>
      <button id="use-theirs" type="button">Use other version</button>
      <button id="keep-mine" type="button">Keep mine</button>
    </div>

    <div id="sync-conflict" class="banner" role="alert" hidden>
      <span id="sync-conflict-text"></span>
      <button id="sync-keep-mine" type="button">Keep this version</button>
      <button id="sync-use-other" type="button">Use other version</button>
      <button id="sync-keep-both" type="button" hidden>Keep both as separate notes</button>
      <details>
        <summary>Show the other version</summary>
        <textarea id="sync-other" readonly rows="8"></textarea>
      </details>
    </div>

    <main class="layout" data-view="list">
      <nav class="list" aria-label="Notes">
        <div class="list-tools">
          <select id="sort" aria-label="Sort notes">
            <option value="modified">Recently changed</option>
            <option value="title">Title</option>
          </select>
          <button id="show-trash" type="button" class="small" aria-pressed="false">Trash</button>
        </div>
        <p id="empty" class="muted">
          Open a folder to start. On iPhone, pick a folder in iCloud Drive.
        </p>
        <ul id="notes"></ul>
      </nav>
      <section class="editor" aria-label="Editor">
        <div id="editor-host" class="editor-host"></div>
        <footer class="status">
          <span id="status" aria-live="polite"></span>
          <span id="tags" class="tags"></span>
          <button id="undo-delete" type="button" class="small" hidden>Undo</button>
          <button id="delete-note" type="button" class="small" disabled>Delete</button>
          <button id="mode" type="button" class="small" aria-pressed="false">Source</button>
        </footer>
      </section>
    </main>
  </body>
</html>
