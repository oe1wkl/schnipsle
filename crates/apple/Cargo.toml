[package]
name = "schnipsle-apple"
description = "Apple platform services: file coordination, presenter and iCloud versions through objc2 (ADR-0015)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
schnipsle-core.workspace = true

# Empty crate on every other platform, so the workspace builds everywhere.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileCoordinator",
  "NSFilePresenter",
  "NSFileVersion",
  "NSOperation",
  "NSRange",
  "NSRunLoop",
  "NSString",
  "NSURL",
  "NSValue",
] }

# Pictures for an export (ADR-0027). Already in the lock file through objc2.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFBase",
  "CFCGTypes",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }

# PDF through the print path (ADR-0022).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSGraphics",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "block2",
  "objc2-app-kit",
  "WKNavigation",
  "WKNavigationDelegate",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebpagePreferences",
] }
tempfile.workspace = true

# PDF through the print formatter on iOS (docs/spikes/ios-pdf.md). Already in
# the lock file through the Tauri shell.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "UIGraphics",
  "UIPrintFormatter",
  "UIPrintPageRenderer",
  "UIResponder",
  "UIView",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "WKNavigation",
  "WKNavigationDelegate",
  "WKWebViewConfiguration",
  "WKWebpagePreferences",
] }

[dev-dependencies]
# Only for examples/engrave_spike.rs.
serde_json.workspace = true
tempfile.workspace = true

# Only for the spikes in examples/ and tests/pdf.rs; already in the lock file through the Tauri shell.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = "0.3"
objc2-pdf-kit = "0.3"
objc2-web-kit = "0.3"
schnipsle-export.workspace = true

# The print path runs on the main thread, which the test harness keeps to itself.
[[test]]
name = "pdf"
harness = false

# Not `workspace = true`: the workspace forbids `unsafe`, but calling Objective-C
# needs it (ADR-0015). Stricter rules than elsewhere make up for it.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
