# Git hooks, installed by `lefthook install` (done by scripts/bootstrap-macos.sh).

# Loaded before every hook so that Git apps that do not read ~/.zshrc still find
# Homebrew, Rust and the project's Node version. Hooks run in the repository root.
rc: scripts/hook-env.sh

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    prettier:
      glob: "*.{ts,js,json,css,html,yml,yaml}"
      run: node_modules/.bin/prettier --check {staged_files}
    eslint:
      glob: "*.{ts,js}"
      run: node_modules/.bin/eslint {staged_files}

commit-msg:
  commands:
    conventional-and-signed:
      run: scripts/check-commit-msg.sh {1}
