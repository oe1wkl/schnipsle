[package]
name = "schnipsle"
description = "Schnipsle app shell (Tauri 2): commands and platform glue around schnipsle-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary (Windows, cargo#8519).
name = "schnipsle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
schnipsle-core.workspace = true
schnipsle-import.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-vault-access = { path = "../crates/tauri-plugin-vault-access" }
serde.workspace = true
serde_json.workspace = true

# File coordination on Apple platforms (ADR-0015).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
schnipsle-apple.workspace = true

# Folder picker on desktop; iOS uses tauri-plugin-vault-access instead.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-dialog = "2"

[lints]
workspace = true
